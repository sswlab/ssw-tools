[project]
name = "ssw-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mgjeon", email = "mgjeon@khu.ac.kr" }
]
requires-python = ">=3.10"
dependencies = [
    "aiapy>=0.10",
    "astropy>=7.1",
    "loguru>=0.7",
    "numpy>=2.0",
    "sunpy>=7.0",
    "tqdm>=4.67",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssw_tools"]