[project]
name = "ssw-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mgjeon", email = "mgjeon@khu.ac.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "aiapy>=0.10.2",
    "astropy>=7.1.1",
    "loguru>=0.7.3",
    "numpy>=2.3.4",
    "sunpy>=7.0.3",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssw_tools"]